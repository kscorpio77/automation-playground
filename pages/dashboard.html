<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("testground_theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <title>Dashboard - Automation Playground</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div id="site-nav-mount"></div>
  </header>

  <main class="page">
    <span class="difficulty difficulty--intermediate">Intermediate</span>
    <h1 class="page__title" data-testid="page-title">Dashboard</h1>
    <aside class="skills-callout"><strong>What can I automate here?</strong> Skills you can practise: protected routes, persistent browser state, session expiration, and logout.</aside>

    <div class="card" data-testid="protected-content">
      <p data-testid="dashboard-welcome" id="dashboard-welcome">Welcome!</p>
      <button class="btn btn--secondary" data-testid="button-simulate-session-expiry">Simulate session expiry</button>
      <button class="btn btn--danger" id="logout-button" data-testid="button-logout">Log out</button>
    </div>

    <div id="selector-ref-mount"></div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="../js/nav.js"></script>
  <script src="../js/selector-ref.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    renderSiteNav("../", "nav-login");
    renderSiteFooter();
    renderSelectorReference("selector-ref-mount", [
      "protected-content",
      "dashboard-welcome",
      "button-simulate-session-expiry",
      "button-logout"
    ], "Only reachable after signing in on the login page; visiting it directly without a session redirects back to login.html.");
  </script>
</body>
</html>
