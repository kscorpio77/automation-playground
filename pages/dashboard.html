<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Automation Testground</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div id="site-nav-mount"></div>
  </header>

  <main class="page">
    <h1 class="page__title" data-testid="page-title">Dashboard</h1>

    <div class="card" data-testid="protected-content">
      <p data-testid="dashboard-welcome" id="dashboard-welcome">Welcome!</p>
      <button class="btn btn--danger" id="logout-button" data-testid="button-logout">Log out</button>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="../js/nav.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    renderSiteNav("../", "nav-login");
    renderSiteFooter();
  </script>
</body>
</html>
